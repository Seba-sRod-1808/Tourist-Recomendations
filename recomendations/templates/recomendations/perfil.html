<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utourist — Mi Perfil</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root { --green-600: #3B6D11; --gray-50: #F1EFE8; --gray-400: #888780; --gray-900: #2C2C2A; }
  body { font-family: 'DM Sans', sans-serif; background: #F4F1EB; margin: 0; color: var(--gray-900); }
  
  nav { background: #fff; padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E8E5DC; }
  .nav-brand { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; color: var(--green-600); text-decoration: none; }
  .btn-back { color: var(--gray-600); text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
  .btn-back:hover { color: var(--green-600); }

  .profile-layout { max-width: 900px; margin: 40px auto; display: grid; grid-template-columns: 260px 1fr; gap: 30px; padding: 0 20px; }
  
  /* Menú lateral */
  .sidebar { background: #fff; border-radius: 16px; border: 1px solid #E8E5DC; overflow: hidden; height: fit-content; }
  .sidebar-link { display: block; padding: 16px 20px; color: var(--gray-600); text-decoration: none; font-weight: 500; border-left: 4px solid transparent; transition: 0.2s; }
  .sidebar-link i { width: 24px; }
  .sidebar-link:hover { background: var(--gray-50); color: var(--gray-900); }
  .sidebar-link.active { border-left-color: var(--green-600); color: var(--green-600); background: #EAF3DE; font-weight: 700; }
  
  /* Contenedor principal del formulario */
  .content-panel { background: #fff; border-radius: 16px; padding: 40px; border: 1px solid #E8E5DC; }
  
  /* Sección superior: Avatar y nombre */
  .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; padding-bottom: 30px; border-bottom: 1px solid #E8E5DC; }
  .avatar-large { width: 80px; height: 80px; background: var(--green-600); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 32px; font-family: 'Fraunces', serif; }
  .profile-info h1 { font-family: 'Fraunces', serif; font-size: 26px; margin: 0 0 5px; }
  .profile-info p { color: var(--gray-400); margin: 0; font-size: 14px; }
  .btn-change-photo { background: var(--gray-50); color: var(--gray-900); border: 1px solid #D3D1C7; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; margin-top: 10px; transition: 0.2s; }
  .btn-change-photo:hover { background: #D3D1C7; }

  /* Formulario de campos */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 12px; font-weight: 700; color: var(--gray-400); text-transform: uppercase; }
  input, select { padding: 12px 16px; border: 1px solid #D3D1C7; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--gray-900); background: #F9F8F6; outline: none; transition: 0.2s; }
  input:focus, select:focus { border-color: var(--green-600); background: #fff; }
  
  .btn-save { background: var(--green-600); color: #fff; border: none; padding: 14px 28px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; float: right; }
  .btn-save:hover { background: #27500A; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,109,17,0.2); }
</style>
</head>
<body>

<nav>
  <a href="{% url 'recommendations' %}" class="nav-brand">Utourist</a>
  <a href="{% url 'recommendations' %}" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Volver al Home</a>
</nav>

<div class="profile-layout">
  
  <div class="sidebar">
    <a href="#" class="sidebar-link active"><i class="fa-solid fa-user"></i> Datos Personales</a>
    <a href="#" class="sidebar-link"><i class="fa-solid fa-compass"></i> Preferencias de Viaje</a>
    <a href="#" class="sidebar-link"><i class="fa-solid fa-lock"></i> Seguridad y Contraseña</a>
    <div style="height: 1px; background: #E8E5DC; margin: 10px 0;"></div>
    <a href="{% url 'logout' %}" class="sidebar-link" style="color: #D85A30;"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</a>
  </div>

  <div class="content-panel">
    
    <div class="profile-header">
      <div class="avatar-large">{{ user_name|make_list|first|upper }}</div>
      <div class="profile-info">
        <h1>{{ user_name }}</h1>
        <p>Usuario Universitario Utourist</p>
        <button class="btn-change-photo"><i class="fa-solid fa-camera"></i> Cambiar foto</button>
      </div>
    </div>

    <form action="#" method="POST">
      <!-- Estos datos los rellenamos con la info real del backend -->
      <div class="form-grid">
        <div class="form-group">
          <label>Nombre Mostrado</label>
          <input type="text" value="{{ user_name }}" name="nombre">
        </div>
        <div class="form-group">
          <label>Correo Electrónico (Solo Lectura)</label>
          <input type="email" value="{{ email }}" readonly style="color: #888780; cursor: not-allowed;">
        </div>
        
        <div class="form-group full">
          <label>Universidad de Origen</label>
          <select name="universidad">
            <option value="UVG" {% if prefs.universidad == 'UVG' %}selected{% endif %}>Universidad del Valle (UVG)</option>
            <option value="USAC" {% if prefs.universidad == 'USAC' %}selected{% endif %}>Universidad de San Carlos (USAC)</option>
            <option value="URL" {% if prefs.universidad == 'URL' %}selected{% endif %}>Universidad Landívar (URL)</option>
            <option value="UFM" {% if prefs.universidad == 'UFM' %}selected{% endif %}>Universidad Francisco Marroquín (UFM)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Carrera que Estudias</label>
          <input type="text" name="carrera" value="{{ prefs.carrera|default:'Ingeniería en Data Science' }}">
        </div>

        <div class="form-group">
          <label>Presupuesto Base</label>
          <select name="presupuesto">
            <option value="economico" {% if prefs.presupuesto == 'Menos de Q200' %}selected{% endif %}>Económico (Menos de Q200)</option>
            <option value="moderado" {% if prefs.presupuesto == 'Q200–Q500' %}selected{% endif %}>Moderado (Q200 – Q500)</option>
            <option value="estandar" {% if prefs.presupuesto == 'Q500–Q1000' %}selected{% endif %}>Estándar (Q500 – Q1,000)</option>
          </select>
        </div>
      </div>

      <button type="button" class="btn-save" onclick="alert('Cambios guardados con éxito en tu perfil.')">Guardar Cambios</button>
    </form>

  </div>
</div>

</body>
</html>
