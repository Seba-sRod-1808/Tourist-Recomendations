<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utourist — Recuperar Contraseña</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'DM Sans', sans-serif; background-color: #F4F1EB; color: #2C2C2A; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .recovery-container { background: #fff; padding: 3rem; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border: 1px solid #E8E5DC; text-align: center; }
  h1 { font-family: 'Fraunces', serif; font-size: 28px; color: #3B6D11; margin-bottom: 10px; }
  p { color: #888780; font-size: 14px; margin-bottom: 2rem; line-height: 1.5; }
  .form-group { margin-bottom: 1.5rem; text-align: left; }
  label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; color: #444441; text-transform: uppercase; }
  input { width: 100%; padding: 12px; border: 1px solid #D3D1C7; border-radius: 10px; font-size: 14px; background: #F9F8F6; outline: none; box-sizing: border-box; font-family: 'DM Sans', sans-serif;}
  input:focus { border-color: #639922; background: #fff; }
  .btn-recovery { width: 100%; background: #3B6D11; color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 0.5rem; transition: background 0.2s; font-family: 'DM Sans', sans-serif; }
  .btn-recovery:hover { background: #27500A; }
  .back-link { margin-top: 1.5rem; font-size: 13.5px; }
  .back-link a { color: #639922; font-weight: 500; text-decoration: none; }
  .back-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="recovery-container">
  <h1>Recuperar cuenta</h1>
  <p>Introduce tu correo electrónico registrado en Utourist y te enviaremos las instrucciones para restablecer tu contraseña de inmediato.</p>
  
  {% if messages %}
    {% for message in messages %}
    <div style="background:#DCFCE7;color:#166534;border:1px solid #86EFAC;border-radius:8px;padding:10px 14px;margin-bottom:1rem;font-size:13px;">
      {{ message }}
    </div>
    {% endfor %}
  {% endif %}

  <form action="{% url 'recuperar_contrasena' %}" method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label>Correo Electrónico</label>
      <input type="email" name="email" placeholder="estudiante@correo.com" required>
    </div>
    <button type="submit" class="btn-recovery">Enviar enlace de recuperación</button>
  </form>
  
  <div class="back-link">
    <a href="{% url 'login' %}">← Volver al inicio de sesión</a>
  </div>
</div>

</body>
</html>
