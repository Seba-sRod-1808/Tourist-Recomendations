<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utourist — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'DM Sans', sans-serif; background-color: #F4F1EB; color: #2C2C2A; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1.5rem; }
  .reset-container { background: #fff; padding: 3rem 2rem; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border: 1px solid #E8E5DC; text-align: center; }
  h1 { font-family: 'Fraunces', serif; font-size: 28px; color: #3B6D11; margin-bottom: 8px; }
  p { color: #888780; font-size: 14px; margin-bottom: 2rem; line-height: 1.5; }
  
  .form-group { margin-bottom: 1.25rem; text-align: left; }
  label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; color: #444441; text-transform: uppercase; }
  input { width: 100%; padding: 12px; border: 1px solid #D3D1C7; border-radius: 10px; font-size: 14px; background: #F9F8F6; outline: none; box-sizing: border-box; font-family: 'DM Sans', sans-serif; transition: border-color 0.2s; }
  input:focus { border-color: #3B6D11; background: #fff; }
  
  .btn-submit { width: 100%; background: #3B6D11; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 1rem; transition: background 0.2s; font-family: 'DM Sans', sans-serif; }
  .btn-submit:hover { background: #27500A; }
  
  .back-link { margin-top: 1.5rem; font-size: 13.5px; }
  .back-link a { color: #888780; font-weight: 500; text-decoration: none; transition: color 0.2s; }
  .back-link a:hover { color: #3B6D11; }
</style>
</head>
<body>

<div class="reset-container">
  <h1>Create New Password</h1>
  <p>Your new password must be different from previous used passwords.</p>
  
  {% if messages %}
    {% for message in messages %}
    <div style="background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5;border-radius:8px;padding:10px 14px;margin-bottom:1rem;font-size:13px; text-align: left;">
      {{ message }}
    </div>
    {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    
    <div class="form-group">
      <label>New Password</label>
      <input type="password" name="new_password" placeholder="Must be at least 8 characters" required>
    </div>
    
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" name="confirm_password" placeholder="Repeat password" required>
    </div>
    
    <button type="submit" class="btn-submit">Reset Password</button>
  </form>
  
  <div class="back-link">
    <a href="{% url 'login' %}">← Back to log in</a>
  </div>
</div>

</body>
</html>
