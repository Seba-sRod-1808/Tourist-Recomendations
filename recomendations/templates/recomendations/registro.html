<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utourist — Crear Cuenta</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'DM Sans', sans-serif; background-color: #F4F1EB; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .login-container { background: #fff; padding: 3rem; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border: 1px solid #E8E5DC; text-align: center; }
  h1 { font-family: 'Fraunces', serif; font-size: 28px; color: #3B6D11; margin-bottom: 8px; }
  p { color: #888780; font-size: 14px; margin-bottom: 2rem; }
  .form-group { margin-bottom: 1.25rem; text-align: left; }
  label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; color: #444441; text-transform: uppercase; }
  input { width: 100%; padding: 12px; border: 1px solid #D3D1C7; border-radius: 10px; font-size: 14px; background: #F9F8F6; outline: none; box-sizing: border-box; font-family: 'DM Sans', sans-serif;}
  input:focus { border-color: #3B6D11; background: #fff; }
  .btn-submit { width: 100%; background: #3B6D11; color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 1rem; transition: background 0.2s; font-family: 'DM Sans', sans-serif; }
  .btn-submit:hover { background: #27500A; }
  .back-link { margin-top: 1.5rem; font-size: 13.5px; }
  .back-link a { color: #3B6D11; font-weight: 500; text-decoration: none; }
  .back-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="login-container">
  <h1>Crear tu cuenta</h1>
  <p>Únete a Utourist y empieza a explorar.</p>
  
  <form action="{% url 'registro' %}" method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label>Nombre Completo</label>
      <input type="text" name="nombre" placeholder="Tu nombre y apellido" required>
    </div>
    <div class="form-group">
      <label>Correo Electrónico</label>
      <input type="email" name="email" placeholder="estudiante@correo.com" required>
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" name="password" placeholder="Crea una contraseña segura" required>
    </div>
    <button type="submit" class="btn-submit">Continuar →</button>
  </form>
  
  <div class="back-link">
    ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
  </div>
</div>

</body>
</html>
